.floor { animation: fade 0.4s cubic-bezier(0.65, 0, 0.35, 1) backwards; }
.box { animation: rise 1.2s cubic-bezier(0.65, 0, 0.35, 1) 0.4s backwards; }
.edge { animation: pulse 10s cubic-bezier(0.65, 0, 0.35, 1) 4s infinite; }
.led { animation: blink 8s steps(1) 4s infinite; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(24px); } }
@keyframes pulse { 50% { opacity: 0.35; } }
@keyframes blink { 92% { opacity: 0.2; } 96% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
