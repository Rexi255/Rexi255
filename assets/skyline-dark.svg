<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 525" width="900" height="525" role="img" aria-label="Isometrische Skyline aus 52 Säulen, eine pro Woche: 28 Contributions im letzten Jahr, die stärkste Woche (12) ist hervorgehoben.">
<style>
text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 24px; }
.t { fill: #2B2145; }
.l { fill: #1E1633; }
.r { fill: #150F24; }
.t, .l, .r, .p, .s { stroke: #2B2145; stroke-width: 1; stroke-linejoin: round; }
.p { fill: #150F24; }
.s { fill: #0C0915; }
.ln { fill: none; stroke: #2B2145; stroke-width: 1; stroke-linecap: round; }
.on { fill: #A855F7; }
.off { fill: #2B2145; }
.ok { fill: #4ADE80; }
.warn { fill: #FBBF24; }
.acc { fill: #A855F7; }
.glow { fill: #D8B4FE; }
.edge-glow { fill: none; stroke: #A855F7; stroke-width: 2; stroke-linecap: round; }
.link { fill: none; stroke: #A855F7; stroke-opacity: 0.45; stroke-width: 2; stroke-linejoin: round; }
.floor { fill: none; stroke: #2B2145; stroke-width: 1; }
.txt { fill: #EDE9FE; }
.mut { fill: #8B81A8; }
@keyframes grow { from { transform: scaleY(0.02); } }
.col { transform-box: fill-box; transform-origin: 50% 100%; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
